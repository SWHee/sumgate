{% extends "base.html" %}
{% block title %}문서{% endblock %}
{% block body %}
<section><h2>문서 목록 {{ real() }}</h2>
<table><tr><th>문서</th><th>종류</th><th>거래처</th><th>사건</th><th>추출기</th><th>상태</th><th>등급</th></tr>
{% for d in docs %}<tr><td><a href="/papers/{{ d.id }}">#{{ d.id }}</a></td><td>{{ d.kind }}</td><td>{{ d.agency_id }}</td>
<td>{% if d.case_id %}<a href="/cases/{{ d.case_id }}">#{{ d.case_id }}</a>{% endif %}</td><td>{{ d.extractor }}</td><td>{{ d.status }}</td><td>{{ grade(d.grade) }}</td></tr>{% endfor %}
</table></section>
{% endblock %}
