[project]
name = "w07-rebate-gate"
version = "0.1.0"
description = "W07 판매장려금 지급 승인 게이트"
requires-python = "==3.13.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "anthropic>=0.70",
    "psycopg[binary]>=3.3.9",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["."]
